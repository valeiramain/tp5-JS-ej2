<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trabajo practico de DOM Y BOM">
    <meta name="keywords" content="DOM, BOM, POO, javascript">
    <meta name="author" content="Valentina Iramain">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>TP5 - JS - Generaciones</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container py-2">
                <a class="navbar-brand text-primary-emphasis fw-bold" href="#">Generaciones</a>
            </div>
        </nav>
    </header>
    <main class="container">
        <h1 class="text-center my-4 text-light fw-bold">Datos Personales</h1>
        <form class="form-generaciones py-3 px-4 fw-bold">
            <div class="mb-3">
                <label for="nombreYApellido" class="form-label">Nombre y Apellido:</label>
                <input type="text" class="form-control" id="nombreYApellido" placeholder="Juan Perez">
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="edad" class="form-label">Edad:</label>
                    <input type="number" class="form-control" id="edad">
                </div>
                <div class="col-md-4">
                    <label for="dni" class="form-label">DNI:</label>
                    <input type="number" class="form-control" id="dni">
                </div>
                <div class="col-md-4">
                    <label for="sexo" class="form-label">Sexo (F ó M):</label>
                    <select id="sexo" name="sexo" class="form-select" aria-label="Seleccione sexo">
                        <option value="" selected disabled>Elija una opción</option>
                        <option value="F">Femenino</option>
                        <option value="M">Masculino</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="peso" class="form-label">Peso:</label>
                    <input type="number" class="form-control" id="peso">
                </div>
                <div class="col-md-6">
                    <label for="altura" class="form-label">Altura:</label>
                    <input type="number" class="form-control" id="altura">
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-secondary text-dark shadow glow-btn">Enviar</button>
            </div>
        </form>

        <section class="d-grid gap-2 d-md-block my-3 text-center form-generaciones ">
            <button type="button" class="btn shadow glow-btn">Mostrar Generación</button>
            <button type="button" class="btn shadow glow-btn">Mayor de Edad</button>
        </section>

        <section class="d-grid gap-2 my-3 text-center form-generaciones " id="resultados">
            <div class="alert alert-primary" role="alert">
                Pertenece a la Gereración
            </div>
            <div class="alert alert-success" role="alert">
                Es mayor de Edad
            </div>
            <div class="alert alert-secondary" role="alert">
                <ul class="list-group p-2 bg-secondary-subtle text-secondary-emphasis">
                    <li class="list-group-item">nombre</li>
                    <li class="list-group-item">nombre</li>
                </ul>
            </div>
            <!-- <p class="p-3 mb-2 text-center bg-secondary-subtle text-secondary-emphasis fs-2">Pertenece a la Gereración -->
            <!-- </p>
            <p class="p-3 mb-2 text-center bg-secondary-subtle text-secondary-emphasis fs-2">Es mayor de Edad</p>
            <ul class="list-group p-3 mb-2 bg-secondary-subtle text-secondary-emphasis">
                <li class="list-group-item">nombre</li>
                <li class="list-group-item">nombre</li>
            </ul> -->
        </section>
    </main>
    <footer class="text-center py-3 bg-body-tertiary">
        <p>&copy; Todos los derechos reservados 2025</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>
