<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trabajo practico de DOM Y BOM">
    <meta name="keywords" content="DOM, BOM, POO, javascript">
    <meta name="author" content="Valentina Iramain">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>TP5 - JS - Ejercicio 2</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container py-2">
                <a class="navbar-brand text-primary-emphasis fw-bold" href="#">Generaciones</a>
            </div>
        </nav>
    </header>
    <main class="container">
        <h1 class="text-center my-4">Datos Personales</h1>
        <form class="border border-danger p-2">
            <div class="mb-3">
                <label for="nombreYApellido" class="form-label">Nombre y Apellido:</label>
                <input type="text" class="form-control" id="nombreYApellido" placeholder="Juan Perez">
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="edad" class="form-label">Edad:</label>
                    <input type="number" class="form-control" id="edad">
                </div>
                <div class="col-md-4">
                    <label for="dni" class="form-label">DNI:</label>
                    <input type="number" class="form-control" id="dni">
                </div>
                <div class="col-md-4">
                    <label for="Sexo" class="form-label">Sexo (F ó M):</label>
                    <select class="form-select" aria-label="Default select sexo">
                        <option selected>Elija una opción</option>
                        <option value="F">Femenino</option>
                        <option value="M">Masculino</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="peso" class="form-label">Peso:</label>
                    <input type="number" class="form-control" id="peso">
                </div>
                <div class="col-md-6">
                    <label for="altura" class="form-label">Altura:</label>
                    <input type="number" class="form-control" id="altura">
                </div>
            </div>
        </form>
    </main>
    <footer class="text-center py-3 bg-body-tertiary">
        <p>&copy; Todos los derechos reservados 2025</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>
